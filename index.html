<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>베스트덴 치과기공소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 어두운 진료실 조명 위에 사진 띠 한 줄, 멈춘 뒤 문장 → 확인용 격자 */
:root {
  --ink: #0d1520;        /* 바탕: 남색 기운의 먹색 */
  --ink-2: #16212f;      /* 카드/격자 바탕 */
  --paper: #eef2f6;      /* 본문 글자 */
  --muted: #8b99aa;      /* 보조 글자 */
  --accent: #9cc3e6;     /* 로고의 라이트블루 */
  --line: rgba(238,242,246,.12);
  --display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; }

/* ── 1. 슬라이드 무대 ── */
.stage { padding-block: 72px 40px; overflow: hidden; }
.stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 28px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.counter { font-family: var(--mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counter b { color: var(--paper); font-weight: 500; }

.viewport { position: relative; }
.track { display: flex; gap: 20px; will-change: transform; }
.slide { flex: 0 0 min(72vw, 760px); aspect-ratio: 1160 / 800; border-radius: 6px; overflow: hidden; background: var(--ink-2);
  opacity: .28; transform: scale(.94); transition: opacity .35s ease, transform .35s ease; }
.slide.on { opacity: 1; transform: scale(1); }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fast .slide { transition-duration: .08s; }

/* 멈춘 뒤 문장 */
.reveal { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(13,21,32,.86) 0%, rgba(13,21,32,.94) 70%);
  opacity: 0; transition: opacity .9s ease; }
.reveal.show { opacity: 1; }
.reveal h2 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5.7vw, 68px); line-height: 1.3; margin: 0; text-wrap: balance; }
.reveal h2 em { font-style: normal; color: var(--accent); }
.reveal p { margin: 18px 0 0; color: var(--muted); font-size: clamp(14px, 1.6vw, 17px); }

.controls { display: flex; gap: 10px; justify-content: center; margin-top: 28px; min-height: 40px; }
.btn { font: 500 14px/1 var(--body); color: var(--paper); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 12px 18px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.album-link { display: block; margin: 18px auto 0; font: 500 15px/1.4 var(--body); color: var(--accent); background: none; border: 0;
  border-bottom: 1px solid currentColor; padding: 2px 0; cursor: pointer; }
.album-link:hover { color: var(--paper); }
.album-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* ── 2. 전체 사진 앨범 (누를 때만 열림) ── */
.album { position: fixed; inset: 0; z-index: 9; background: var(--ink); overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 0 calc(48px + env(safe-area-inset-bottom, 0px)); }
.album-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
.album-head h3 { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 2.6vw, 28px); margin: 0; }
.album-head span { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.grid button { padding: 0; border: 0; background: var(--ink-2); border-radius: 4px; overflow: hidden; cursor: zoom-in; aspect-ratio: 1160/800; }
.grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.grid button:hover img { transform: scale(1.04); }
.grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 크게 보기 */
.lightbox { position: fixed; inset: 0; background: rgba(5,9,14,.94); display: grid; place-items: center; padding: 16px; z-index: 10; }
.lightbox img { max-width: min(1160px, 100%); max-height: 86vh; border-radius: 4px; }
.lightbox .close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; }
.lightbox img { touch-action: pan-y; user-select: none; -webkit-user-drag: none; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(13,21,32,.7); color: var(--paper); cursor: pointer;
  display: grid; place-items: center; }
.lb-nav:hover { border-color: var(--accent); color: var(--accent); }
.lb-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lb-nav svg { width: 22px; height: 22px; }
.lb-prev { left: 16px; } .lb-next { right: 16px; }
.lb-count { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center;
  font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .lb-nav { width: 44px; height: 44px; top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); transform: none; } }

@media (max-width: 600px) {
  .stage { padding-block: 48px 32px; }
  .slide { flex-basis: 84vw; }
  .track { gap: 12px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<section class="stage" aria-label="환자 미소 사진">
  <div class="wrap stage-head">
    <span class="eyebrow">BestDen · 체어사이드 사진</span>
    <span class="counter" aria-live="off"><b id="cur">01</b> / <span id="tot">47</span></span>
  </div>
  <div class="viewport" id="viewport">
    <div class="track" id="track"></div>
    <div class="reveal" id="reveal" aria-live="polite">
      <div class="wrap">
        <h2>방금 지나간 <span id="revealCount">47</span>분,<br><em>전부 틀니입니다.</em></h2>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="toggle" type="button">일시정지</button>
    <button class="btn" id="replay" type="button" hidden>처음부터 다시</button>
  </div>
  <button class="album-link" id="albumOpen" type="button">전체 사진 둘러보기</button>
</section>

<div class="album" id="album" role="dialog" aria-modal="true" aria-labelledby="albumTitle" hidden>
  <div class="wrap">
    <div class="album-head">
      <h3 id="albumTitle">전체 사진<span id="albumCount">47장</span></h3>
      <button class="btn" id="albumClose" type="button">닫기</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="btn close" id="lbClose" type="button">닫기</button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="이전 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
(() => {
  const N = 47, SLOW = 12;
  const src = i => `img/${String(i + 1).padStart(2, "0")}.jpg`;
  const track = document.getElementById("track"), viewport = document.getElementById("viewport");
  const cur = document.getElementById("cur"), reveal = document.getElementById("reveal");
  const toggle = document.getElementById("toggle"), replay = document.getElementById("replay");
  const albumOpen = document.getElementById("albumOpen");
  document.getElementById("tot").textContent = N;
  document.getElementById("revealCount").textContent = N;

  const slides = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement("div"); d.className = "slide";
    const im = new Image(); im.src = src(i); im.alt = `환자 미소 사진 ${i + 1}`; im.decoding = "async";
    d.appendChild(im); track.appendChild(d); slides.push(d);
  }

  // 1~4번은 또박또박, 5~10번은 완만하게 빨라지고, 11~12번에서 이어 붙여 13번부터 빠른 구간 (ms)
  const slowSteps = [1700, 1450, 1250, 950, 880, 800, 710, 620, 530, 440, 340, 270];
  const PACE = 1.12; // 전체 속도 배율 (클수록 천천히)
  const delays = [];
  for (let i = 0; i < N - 1; i++) {
    const base = i < SLOW ? slowSteps[i] : 220 * Math.pow(45 / 220, (i - SLOW) / Math.max(1, N - 2 - SLOW));
    delays.push(Math.round(base * PACE));
  }

  let idx = 0, timer = null, paused = false, done = false;
  function show(i) {
    idx = i;
    slides.forEach((s, k) => s.classList.toggle("on", k === i));
    const s = slides[i];
    const x = s.offsetLeft - (viewport.clientWidth - s.offsetWidth) / 2;
    const d = delays[i] ?? 900;
    track.classList.toggle("fast", d < 300);
    track.style.transition = `transform ${Math.min(0.55, d * 0.8 / 1000)}s cubic-bezier(.22,.7,.2,1)`;
    track.style.transform = `translateX(${-x}px)`;
    cur.textContent = String(i + 1).padStart(2, "0");
  }
  function step() {
    if (paused) return;
    if (idx >= N - 1) return finish();
    show(idx + 1);
    timer = setTimeout(step, idx >= N - 1 ? 900 : delays[idx]);
  }
  function finish() {
    done = true; reveal.classList.add("show");
    toggle.hidden = true; replay.hidden = false;
  }
  function start() {
    clearTimeout(timer); done = false; paused = false;
    reveal.classList.remove("show"); toggle.hidden = false; toggle.textContent = "일시정지";
    replay.hidden = true;
    show(0); timer = setTimeout(step, delays[0]);
  }
  function setPaused(p) {
    if (done) return;
    paused = p; toggle.textContent = p ? "계속 보기" : "일시정지";
    clearTimeout(timer); if (!p) timer = setTimeout(step, Math.max(300, delays[idx] || 300));
  }
  toggle.addEventListener("click", () => setPaused(!paused));
  viewport.addEventListener("click", () => setPaused(!paused));
  replay.addEventListener("click", start);
  addEventListener("resize", () => show(idx));

  // 전체 사진 앨범: 링크를 누를 때만 열고, 사진은 그때 처음 만든다
  const grid = document.getElementById("grid"), lb = document.getElementById("lightbox"), lbImg = document.getElementById("lbImg");
  const album = document.getElementById("album");
  document.getElementById("albumCount").textContent = `${N}장`;
  function buildGrid() {
    if (grid.childElementCount) return;
    for (let i = 0; i < N; i++) {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `사진 ${i + 1} 크게 보기`);
      const im = new Image(); im.src = src(i); im.alt = ""; im.loading = "lazy"; b.appendChild(im);
      b.addEventListener("click", () => openLb(i));
      grid.appendChild(b);
    }
  }
  let wasPlaying = false;
  const openAlbum = () => { wasPlaying = !done && !paused; if (wasPlaying) setPaused(true); buildGrid(); album.hidden = false; album.scrollTop = 0; document.body.style.overflow = "hidden"; document.getElementById("albumClose").focus(); };
  const closeAlbum = () => { album.hidden = true; document.body.style.overflow = ""; albumOpen.focus(); if (wasPlaying) setPaused(false); };
  albumOpen.addEventListener("click", openAlbum);
  document.getElementById("albumClose").addEventListener("click", closeAlbum);
  let lbIdx = 0;
  function openLb(i) {
    lbIdx = (i + N) % N;
    lbImg.src = src(lbIdx); lbImg.alt = `환자 미소 사진 ${lbIdx + 1}`;
    document.getElementById("lbCount").textContent = `${lbIdx + 1} / ${N}`;
    lb.hidden = false;
  }
  document.getElementById("lbPrev").addEventListener("click", () => openLb(lbIdx - 1));
  document.getElementById("lbNext").addEventListener("click", () => openLb(lbIdx + 1));
  // 스와이프: 가로로 50px 이상 밀면 넘김
  let sx = null, sy = null;
  lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) openLb(lbIdx + (dx < 0 ? 1 : -1));
  });
  const closeLb = () => { lb.hidden = true; };
  document.getElementById("lbClose").addEventListener("click", closeLb);
  lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
  addEventListener("keydown", e => {
    if (!lb.hidden && e.key === "ArrowLeft") return openLb(lbIdx - 1);
    if (!lb.hidden && e.key === "ArrowRight") return openLb(lbIdx + 1);
    if (e.key !== "Escape") return;
    if (!lb.hidden) closeLb(); else if (!album.hidden) closeAlbum();
  });

  // 화면에 들어오면 시작, 움직임 줄이기 설정이면 바로 결과
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { show(N - 1); finish(); return; }
  show(0);
  let started = false;
  const go = () => { if (!started) { started = true; start(); } };
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es, ob) => { if (es.some(e => e.isIntersecting)) { go(); ob.disconnect(); } }, { threshold: .5 }).observe(viewport);
  } else go();
})();
</script>
</body>
</html>
